openapi: 3.1.0
info:
  title: DevSphere Workspace & Project Management API
  version: 1.0.0
  description: >
    RESTful API endpoints for multi-tenant workspace provisioning, lifecycle management,
    project initiation, and workflow status transitions within DevSphere.
servers:
  - url: /api/v1
paths:
  /workspaces:
    post:
      summary: Create a new workspace
      description: >
        Creates a new workspace in SETUP_INCOMPLETE status and atomically establishes the caller
        as the initial workspace member with OWNER role. Requires authenticated session.
      operationId: createWorkspace
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Workspace with slug already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      summary: List user workspaces
      description: >
        Returns a paginated list of workspaces in which the authenticated user holds an active membership.
      operationId: listWorkspaces
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..10000)
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: size
          in: query
          description: Page size (1..100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated workspaces list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workspaces/{workspaceId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Unique workspace UUID
        schema:
          type: string
          format: uuid

    get:
      summary: Get workspace details
      description: >
        Retrieves workspace metadata. Caller must hold an active membership in the workspace.
      operationId: getWorkspace
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Workspace metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

    patch:
      summary: Update workspace details
      description: >
        Updates workspace name and description with optimistic locking. Caller must hold the OWNER role.
      operationId: updateWorkspace
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Stale version (PLAN_STALE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /workspaces/{workspaceId}/setup:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Unique workspace UUID
        schema:
          type: string
          format: uuid

    get:
      summary: Get workspace setup status
      description: >
        Returns setup diagnostic facts including project configuration, PM assignment, and pending invitation count.
        Caller must hold the OWNER role.
      operationId: getWorkspaceSetup
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Workspace setup diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /workspaces/{workspaceId}/projects:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Unique workspace UUID
        schema:
          type: string
          format: uuid

    post:
      summary: Create project in workspace
      description: >
        Creates a new project in PLANNING status. Enforces exactly one project per workspace.
        Caller must be the workspace OWNER. If selfAssignPm is true, caller is assigned the PM role
        and workspace status advances to ACTIVE.
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate project in workspace (DUPLICATE_RESOURCE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      summary: List projects in workspace
      description: >
        Returns list of projects belonging to the specified workspace (0 or 1 project).
        Caller must be an active workspace member.
      operationId: listProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Unique workspace UUID
        schema:
          type: string
          format: uuid
      - name: projectId
        in: path
        required: true
        description: Unique project UUID
        schema:
          type: string
          format: uuid

    get:
      summary: Get project details
      description: >
        Retrieves project details. Validates tenant scoping (project must belong to the workspace).
        Caller must be an active member of the workspace.
      operationId: getProject
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

    patch:
      summary: Update project details
      description: >
        Updates project metadata with optimistic locking. Caller must hold active PM role.
        Alteration of committedDeadline is rejected with 409 CLIENT_DEADLINE_CONFIRMATION_REQUIRED.
      operationId: updateProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Optimistic lock failure (PLAN_STALE) or deadline change attempted (CLIENT_DEADLINE_CONFIRMATION_REQUIRED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /workspaces/{workspaceId}/projects/{projectId}/activate:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Unique workspace UUID
        schema:
          type: string
          format: uuid
      - name: projectId
        in: path
        required: true
        description: Unique project UUID
        schema:
          type: string
          format: uuid

    post:
      summary: Activate project
      description: >
        Transitions project status from PLANNING or ON_HOLD to ACTIVE. Caller must hold active PM role.
        Preconditions enforced: objective non-blank, plannedStart set, at least 1 non-deleted backlog item,
        exactly 1 eligible active PM, and valid timezone.
      operationId: activateProject
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateProjectRequest'
      responses:
        '200':
          description: Project successfully activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Optimistic lock mismatch (PLAN_STALE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Activation preconditions not met (ACTIVATION_PRECONDITION_FAILED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token representing an active user session

  schemas:
    CreateWorkspaceRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          example: Acme Engineering
        slug:
          type: string
          minLength: 3
          maxLength: 80
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: acme-engineering
        description:
          type: string
          nullable: true
          example: Primary engineering and product workspace

    UpdateWorkspaceRequest:
      type: object
      required:
        - expectedVersion
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          nullable: true
          example: Acme Engineering Team
        description:
          type: string
          nullable: true
          example: Updated workspace description
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          example: 0

    WorkspaceResponse:
      type: object
      required:
        - id
        - slug
        - name
        - status
        - ownerId
        - version
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/WorkspaceStatus'
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    WorkspaceSetupResponse:
      type: object
      required:
        - workspaceId
        - slug
        - name
        - status
        - projectConfigured
        - pmAssigned
        - pendingInvitationsCount
        - createdAt
      properties:
        workspaceId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/WorkspaceStatus'
        projectConfigured:
          type: boolean
        pmAssigned:
          type: boolean
        pendingInvitationsCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    WorkspaceMemberResponse:
      type: object
      required:
        - id
        - workspaceId
        - userId
        - role
        - status
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceMemberRole'
        status:
          $ref: '#/components/schemas/WorkspaceMemberStatus'
        joinedAt:
          type: string
          format: date-time

    WorkspacePageResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
        content:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    CreateProjectRequest:
      type: object
      required:
        - projectKey
        - name
      properties:
        projectKey:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^[A-Z0-9]{2,16}$'
          example: ACM
        name:
          type: string
          minLength: 1
          maxLength: 160
          example: Platform Core
        description:
          type: string
          nullable: true
          example: Core backend platform services
        objective:
          type: string
          nullable: true
          example: Build scalable backend infrastructure
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
          example: Asia/Ho_Chi_Minh
        plannedStart:
          type: string
          format: date
          nullable: true
          example: '2026-12-01'
        committedDeadline:
          type: string
          format: date
          nullable: true
          example: '2027-06-01'
        sprintLengthDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 14
          example: 14
        selfAssignPm:
          type: boolean
          default: true
          example: true

    UpdateProjectRequest:
      type: object
      required:
        - expectedVersion
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          nullable: true
        description:
          type: string
          nullable: true
        objective:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        plannedStart:
          type: string
          format: date
          nullable: true
        committedDeadline:
          type: string
          format: date
          nullable: true
          description: Rejected with 409 if modified via standard update
        sprintLengthDays:
          type: integer
          minimum: 1
          maximum: 90
          nullable: true
        expectedVersion:
          type: integer
          format: int64
          minimum: 0

    ActivateProjectRequest:
      type: object
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          example: 0

    ProjectResponse:
      type: object
      required:
        - id
        - workspaceId
        - projectKey
        - name
        - status
        - timezone
        - sprintLengthDays
        - nextItemNumber
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        projectKey:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        objective:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ProjectStatus'
        timezone:
          type: string
        plannedStart:
          type: string
          format: date
          nullable: true
        committedDeadline:
          type: string
          format: date
          nullable: true
        sprintLengthDays:
          type: integer
        nextItemNumber:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    WorkspaceStatus:
      type: string
      enum:
        - SETUP_INCOMPLETE
        - ACTIVE
        - ARCHIVED

    WorkspaceMemberRole:
      type: string
      enum:
        - OWNER
        - MEMBER

    WorkspaceMemberStatus:
      type: string
      enum:
        - ACTIVE
        - REMOVED

    ProjectStatus:
      type: string
      enum:
        - PLANNING
        - ACTIVE
        - ON_HOLD
        - COMPLETED
        - ARCHIVED

    ProblemDetail:
      type: object
      required:
        - status
        - title
      properties:
        status:
          type: integer
          example: 400
        title:
          type: string
          example: VALIDATION_FAILED
        detail:
          type: string
          example: Validation failed
        code:
          type: string
          example: VALIDATION_FAILED

  responses:
    ValidationFailed:
      description: Input validation failed or malformed request payload
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Unauthorized:
      description: Authentication missing, invalid, or expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: Access denied or insufficient role permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ResourceNotFound:
      description: Target entity was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
