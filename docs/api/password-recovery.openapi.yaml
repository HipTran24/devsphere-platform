openapi: 3.1.0
info:
  title: DevSphere password recovery
  version: 0.1.0
  description: M1.3 endpoints implementing password recovery intake, code verification for single-use reset grant, and password reset with full session revocation.
servers:
  - url: /api/v1
paths:
  /auth/forgot-password:
    post:
      operationId: requestPasswordRecovery
      summary: Request a password recovery code by email
      description: Returns 202 ACCEPTED uniformly for all intake requests (active, pending, locked, nonexistent, or throttled). Never exposes account existence or details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
      responses:
        '202':
          description: Recovery intake accepted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ACCEPTED
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/forgot-password/verify:
    post:
      operationId: verifyPasswordRecoveryCode
      summary: Verify the six-digit recovery code and exchange for a reset grant
      description: Exchanges an active eligible bound OTP for an opaque single-use 43-character Base64URL reset grant expiring in 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Single-use password reset grant issued
          content:
            application/json:
              schema:
                type: object
                required: [resetGrant, expiresAt]
                properties:
                  resetGrant:
                    type: string
                    description: 43-character unpadded Base64URL single-use reset grant token
                    example: "43CharactersOpaqueBase64UrlResetGrantTokenValue"
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: RESET_CODE_INVALID or VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/reset-password:
    post:
      operationId: resetPasswordWithGrant
      summary: Complete password reset and revoke all existing sessions
      description: Sets a new password using a valid single-use reset grant and revokes all active and expired session rows across all session families for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetGrant, newPassword]
              properties:
                resetGrant:
                  type: string
                  description: Opaque single-use reset grant. Any supplied string is evaluated; invalid grants produce RESET_GRANT_INVALID.
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
      responses:
        '200':
          description: Password reset complete and sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revokedSessions]
                properties:
                  revokedSessions:
                    type: integer
                    minimum: 0
                    description: Number of previously unrevoked session rows revoked
        '400':
          description: RESET_GRANT_INVALID or VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  schemas:
    Problem:
      type: object
      required: [status, title, detail, code]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        code:
          type: string
  responses:
    InvalidRequest:
      description: VALIDATION_FAILED for malformed input or missing fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request limit exceeded on this route
      headers:
        Retry-After:
          description: Minimum seconds before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthUnavailable:
      description: AUTH_NOT_CONFIGURED when OTP crypto or mail services are unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
