openapi: 3.1.0
info:
  title: DevSphere Session API
  version: 0.1.0
servers:
  - url: /api/v1/auth
paths:
  /csrf:
    get:
      operationId: getSessionCsrf
      summary: Bootstrap CSRF for a same-origin browser
      responses:
        '200':
          description: The masked CSRF token and the name of its request header
          content:
            application/json:
              schema:
                type: object
                required: [headerName, parameterName, token]
                properties:
                  headerName: {type: string, example: X-XSRF-TOKEN}
                  parameterName: {type: string}
                  token: {type: string}
  /login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 320}
                password: {type: string, format: password, minLength: 1, maxLength: 128}
      responses:
        '200': {$ref: '#/components/responses/Issued'}
        '400': {description: Invalid credentials request body}
        '401': {description: Invalid email or password}
        '403': {description: CSRF check failed or email has not been verified}
        '423': {description: Account locked}
        '429':
          description: Sign-in attempt limit reached
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
  /refresh:
    post:
      operationId: rotateSession
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200': {$ref: '#/components/responses/Issued'}
        '401': {description: "Session missing, expired, revoked or replayed"}
        '403': {description: CSRF check failed}
  /logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': {description: Refresh cookie cleared and existing session revoked}
        '403': {description: CSRF check failed}
  /me:
    get:
      operationId: getCurrentUser
      security:
        - accessToken: []
      responses:
        '200':
          description: Current account and session
          content:
            application/json:
              schema:
                type: object
                required: [userId, sessionId, displayName, systemRole]
                properties:
                  userId: {type: string, format: uuid}
                  sessionId: {type: string, format: uuid}
                  displayName: {type: string}
                  systemRole: {type: string, enum: [USER, ADMIN]}
        '401': {description: Access token is missing or its session is invalid}
  /sessions:
    get:
      operationId: listMySessions
      security:
        - accessToken: []
      responses:
        '200':
          description: Up to 100 unexpired session families owned by the account
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  type: object
                  required: [familyId, issuedAt, expiresAt, current]
                  properties:
                    familyId: {type: string, format: uuid}
                    issuedAt: {type: string, format: date-time}
                    expiresAt: {type: string, format: date-time}
                    current: {type: boolean}
        '401': {description: Access token is missing or its session is invalid}
  /sessions/{familyId}:
    delete:
      operationId: revokeMySession
      security:
        - accessToken: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Active session family revoked}
        '400': {description: Invalid session identifier}
        '401': {description: Access token is missing or its session is invalid}
        '404': {description: No active session family with that identifier is owned by the account}
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-devsphere-refresh
  parameters:
    Csrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: The value returned by GET /csrf, sent with the associated cookie.
      schema: {type: string}
  responses:
    Issued:
      description: A new access JWT and a rotation-ready HttpOnly refresh cookie
      headers:
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, expiresAt]
            properties:
              accessToken: {type: string}
              expiresAt: {type: string, format: date-time}
