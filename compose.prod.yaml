# DevSphere production stack (single EC2 host, Docker Compose v2).
#
#   docker compose -f compose.prod.yaml --env-file .env up -d
#
# Only nginx publishes ports (80/443). Everything else lives on internal_net,
# which has no route to the outside world.
name: devsphere-prod

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
      labels: "com.docker.compose.service"

services:
  postgres:
    <<: *hardening
    image: postgres:18.7
    container_name: devsphere-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-devsphere}
      POSTGRES_USER: ${MIGRATION_USER:-devsphere}
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
      DATABASE_USER: ${DATABASE_USER:-devsphere_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/runtime-role.sql:/docker-entrypoint-initdb.d/010-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - internal_net

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    container_name: devsphere-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    networks:
      - internal_net

  # One-shot tool: re-applies the least-privilege runtime role on an existing volume.
  #   docker compose -f compose.prod.yaml --profile tools run --rm database-setup
  database-setup:
    image: postgres:18.7
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DATABASE_NAME:-devsphere}
      PGUSER: ${MIGRATION_USER:-devsphere}
      PGPASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
      DATABASE_USER: ${DATABASE_USER:-devsphere_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - ./infra/postgres/runtime-role.sql:/bootstrap/runtime-role.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/runtime-role.sql"]
    networks:
      - internal_net

  backend:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: devsphere/backend:${DEVSPHERE_VERSION:-latest}
    container_name: devsphere-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # The -D flag publishes HTTP latency histograms so p95 alerts and dashboards work.
      - JAVA_OPTS=${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Dmanagement.metrics.distribution.percentiles-histogram.http.server.requests=true}
      - DEVSPHERE_BACKUP_DIRECTORY=/backups
      - TZ=UTC
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${DATABASE_NAME:-devsphere}
      - DATABASE_USER=${DATABASE_USER:-devsphere_app}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      - MIGRATION_USER=${MIGRATION_USER:-devsphere}
      - MIGRATION_PASSWORD=${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-20}
      - AUTH_SESSION_SIGNING_KEY=${AUTH_SESSION_SIGNING_KEY:?Set AUTH_SESSION_SIGNING_KEY in .env}
      - AUTH_SESSION_ISSUER=${AUTH_SESSION_ISSUER:-devsphere}
      - AUTH_SESSION_AUDIENCE=${AUTH_SESSION_AUDIENCE:-devsphere-api}
      - AWS_REGION=${AWS_REGION:?Set AWS_REGION in .env}
      - S3_BUCKET=${S3_BUCKET:?Set S3_BUCKET in .env}
      # Optional values: forwarded only when set in .env or the shell.
      - AUTH_OTP_HMAC_KEY
      - AUTH_OTP_ENCRYPTION_KEY
      - AUTH_MAIL_FROM
      - SPRING_MAIL_HOST
      - SPRING_MAIL_PORT
      - SPRING_MAIL_USERNAME
      - SPRING_MAIL_PASSWORD
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
      - S3_ENDPOINT
      - S3_PATH_STYLE_ACCESS
      - DEVSPHERE_QUARTZ_CRON_OVERDUE_SCAN
      - DEVSPHERE_QUARTZ_CRON_WEBHOOK_RETRY
      - DEVSPHERE_QUARTZ_CRON_OUTBOX_DISPATCH
      - DEVSPHERE_QUARTZ_CRON_GITHUB_BACKFILL
      - DEVSPHERE_QUARTZ_CRON_DAILY_REPORT
      - DEVSPHERE_QUARTZ_CRON_NIGHTLY_BACKUP
    volumes:
      # Read-only view of the encrypted backups so the nightly BACKUP_CHECK job can verify freshness.
      - ${BACKUP_HOST_DIR:-/var/backups/devsphere}:/backups:ro
    healthcheck:
      # Actuator is served on the internal management port 8081 by the prod profile.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4g
    expose:
      - "8080"
      - "8081"
    networks:
      # internal_net: database/redis/proxy traffic. public_net is egress-only
      # (S3, SMTP, GitHub); the backend publishes no host ports.
      - internal_net
      - public_net

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: devsphere/frontend:${DEVSPHERE_VERSION:-latest}
    container_name: devsphere-frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    expose:
      - "3000"
    networks:
      - internal_net

  nginx:
    <<: *hardening
    image: nginx:1.28-alpine
    container_name: devsphere-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload periodically so renewed certificates are picked up without downtime.
    command:
      - sh
      - -c
      - 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    networks:
      - public_net
      - internal_net

  # Let's Encrypt tooling. Issue certificates with infra/nginx/init-letsencrypt.sh,
  # renew with: docker compose -f compose.prod.yaml --profile tools run --rm certbot renew
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["certbot"]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - public_net

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.1
    container_name: devsphere-prometheus
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Holds the short-lived admin bearer token written by infra/monitoring/refresh-scrape-token.sh.
      - ./infra/monitoring/prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    networks:
      - internal_net

  loki:
    <<: *hardening
    image: grafana/loki:3.5.0
    container_name: devsphere-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    networks:
      - internal_net

  alloy:
    <<: *hardening
    image: grafana/alloy:v1.9.0
    container_name: devsphere-alloy
    depends_on:
      loki:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to json-file container logs; the Docker socket is NOT mounted.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    networks:
      - internal_net

  grafana:
    <<: *hardening
    image: grafana/grafana:12.0.0
    container_name: devsphere-grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Loopback only: reach it with `ssh -L 3001:127.0.0.1:3001 <host>`. Never expose Grafana publicly.
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      # public_net is required for the loopback port mapping (internal networks cannot publish ports).
      - internal_net
      - public_net

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  certbot-conf:
  certbot-www:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
