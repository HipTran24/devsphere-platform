<svg width="1280" height="631" viewBox="0 0 1280 631" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>@keyframes starTwinkle {
  0%, 100% {
    opacity: 0.25;
    transform: scale(0.72) rotate(0deg);
    filter: drop-shadow(0 0 2px rgba(46, 229, 193, 0.2));
  }
  50% {
    opacity: 1;
    transform: scale(1) rotate(8deg);
    filter: drop-shadow(0 0 10px rgba(46, 229, 193, 0.85));
  }
}

@keyframes starTwinkleWhite {
  0%, 100% {
    opacity: 0.2;
    transform: scale(0.7) rotate(0deg);
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.2));
  }
  50% {
    opacity: 1;
    transform: scale(1) rotate(-8deg);
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
  }
}

@keyframes dotTwinkle {
  0%, 100% {
    opacity: 0.18;
    transform: scale(0.65);
    filter: drop-shadow(0 0 2px rgba(46, 229, 193, 0.2));
  }
  50% {
    opacity: 1;
    transform: scale(1);
    filter: drop-shadow(0 0 8px rgba(46, 229, 193, 0.95));
  }
}

@keyframes dotTwinkleWhite {
  0%, 100% {
    opacity: 0.15;
    transform: scale(0.65);
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.2));
  }
  50% {
    opacity: 1;
    transform: scale(1);
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.95));
  }
}

.star-twinkle-1 {
  animation: starTwinkle 2.4s ease-in-out infinite;
}
.star-twinkle-2 {
  animation: starTwinkleWhite 2.8s ease-in-out 0.6s infinite;
}
.star-twinkle-3 {
  animation: starTwinkle 2.2s ease-in-out 1.1s infinite;
}
.star-twinkle-4 {
  animation: starTwinkle 3.1s ease-in-out 0.3s infinite;
}
.star-twinkle-5 {
  animation: starTwinkleWhite 2.5s ease-in-out 1.5s infinite;
}

.dot-twinkle-1 {
  animation: dotTwinkleWhite 2.1s ease-in-out 0.2s infinite;
}
.dot-twinkle-2 {
  animation: dotTwinkle 1.9s ease-in-out 0.8s infinite;
}
.dot-twinkle-3 {
  animation: dotTwinkle 2.6s ease-in-out 1.3s infinite;
}
.dot-twinkle-4 {
  animation: dotTwinkleWhite 2.3s ease-in-out 0.5s infinite;
}
.dot-twinkle-5 {
  animation: dotTwinkle 2.0s ease-in-out 1.6s infinite;
}
.dot-twinkle-6 {
  animation: dotTwinkleWhite 2.7s ease-in-out 0.9s infinite;
}
.dot-twinkle-7 {
  animation: dotTwinkle 1.8s ease-in-out 0.4s infinite;
}

[class*="star-twinkle-"], [class*="dot-twinkle-"] {
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  [class*="star-twinkle-"], [class*="dot-twinkle-"] {
    animation: none;
  }
}</style>
