# Upstreams resolve on the compose internal network.
upstream devsphere_backend {
    server backend:8080;
    keepalive 32;
}

upstream devsphere_frontend {
    server frontend:3000;
    keepalive 16;
}

# --- :80 -> ACME challenge + redirect to HTTPS ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- :443 -> TLS termination and reverse proxy ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/devsphere/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devsphere/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_per_ip 50;

    # Actuator (metrics, health details) is internal only: Prometheus scrapes backend:8081 directly.
    location ^~ /actuator/ {
        deny all;
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/v1/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /ws/ {
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location / {
        proxy_pass http://devsphere_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
