# Shared reverse-proxy settings for backend locations.
proxy_pass http://devsphere_backend;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwrite (never append) so clients cannot spoof their address.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Always generated at the edge; never trust a client-supplied trace id.
proxy_set_header X-Trace-Id        $request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 5s;
