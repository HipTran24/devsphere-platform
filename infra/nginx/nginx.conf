# DevSphere edge proxy. Site configuration lives in conf.d/devsphere.conf.
user  nginx;
worker_processes  auto;
pid        /tmp/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Never advertise the nginx version.
    server_tokens off;

    # $request_id is forwarded as X-Trace-Id so every request is traceable end to end.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time trace=$request_id';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    client_max_body_size     25m;
    client_body_timeout      15s;
    client_header_timeout    15s;
    send_timeout             30s;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    # Coarse abuse protection in front of the application's own rate limiting.
    limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=api_auth:10m     rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
