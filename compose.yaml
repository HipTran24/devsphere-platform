name: devsphere
services:
  database:
    image: postgres:18.7
    container_name: Devphere-DB
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-devsphere}
      POSTGRES_USER: ${MIGRATION_USER:-devsphere}
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
      DATABASE_USER: ${DATABASE_USER:-devsphere_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DATABASE_PORT:-54329}:5432"
    volumes:
      - database-data:/var/lib/postgresql
      - ./infra/postgres/runtime-role.sql:/docker-entrypoint-initdb.d/010-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
  database-setup:
    image: postgres:18.7
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${DATABASE_NAME:-devsphere}
      PGUSER: ${MIGRATION_USER:-devsphere}
      PGPASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
      DATABASE_USER: ${DATABASE_USER:-devsphere_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - ./infra/postgres/runtime-role.sql:/bootstrap/runtime-role.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/runtime-role.sql"]
volumes:
  database-data:
