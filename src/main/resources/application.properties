spring.application.name=devsphere
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:54329/devsphere}
spring.datasource.username=${DATABASE_USER:devsphere_app}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.json_format_mapper=com.project.devsphere.sharedkernel.persistence.IsoJsonFormatMapper
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
devsphere.auth.otp.hmac-key=${AUTH_OTP_HMAC_KEY:}
devsphere.auth.otp.encryption-key=${AUTH_OTP_ENCRYPTION_KEY:}
devsphere.auth.mail.from=${AUTH_MAIL_FROM:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
devsphere.auth.session.signing-key=${AUTH_SESSION_SIGNING_KEY:}
devsphere.auth.session.issuer=${AUTH_SESSION_ISSUER:devsphere}
devsphere.auth.session.audience=${AUTH_SESSION_AUDIENCE:devsphere-api}
