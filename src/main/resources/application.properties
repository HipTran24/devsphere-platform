spring.application.name=devsphere
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:54329/devsphere}
spring.datasource.username=${DATABASE_USER:devsphere_app}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.json_format_mapper=com.project.devsphere.sharedkernel.persistence.IsoJsonFormatMapper
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
devsphere.auth.otp.hmac-key=${AUTH_OTP_HMAC_KEY:}
devsphere.auth.otp.encryption-key=${AUTH_OTP_ENCRYPTION_KEY:}
devsphere.auth.mail.from=${AUTH_MAIL_FROM:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
devsphere.auth.session.signing-key=${AUTH_SESSION_SIGNING_KEY:}
devsphere.auth.session.issuer=${AUTH_SESSION_ISSUER:devsphere}
devsphere.auth.session.audience=${AUTH_SESSION_AUDIENCE:devsphere-api}

# Operations scheduler: in-memory Quartz triggers drive the durable background_jobs outbox.
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=${DEVSPHERE_QUARTZ_AUTO_STARTUP:true}
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.threadPool.threadCount=4
spring.quartz.properties.org.quartz.scheduler.skipUpdateCheck=true
devsphere.quartz.cron.overdue-scan=0 */5 * * * ?
devsphere.quartz.cron.webhook-retry=0 */5 * * * ?
devsphere.quartz.cron.outbox-dispatch=0 */5 * * * ?
devsphere.quartz.cron.github-backfill=0 */30 * * * ?
devsphere.quartz.cron.daily-report=0 0 8 * * ?
devsphere.quartz.cron.nightly-backup=0 0 2 * * ?

# Actuator: SMTP reachability must not gate application health (mail is delivered asynchronously by the outbox).
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,jobQueue,storage
management.metrics.tags.application=${spring.application.name}
logging.pattern.level=%5p [trace=%X{traceId:-}]

# Object storage: local HMAC-signed URLs by default, AWS SigV4 presigning with mode=aws.
devsphere.storage.s3.mode=${STORAGE_MODE:local}
devsphere.storage.s3.bucket=${S3_BUCKET:devsphere-attachments}
devsphere.storage.s3.region=${AWS_REGION:us-east-1}
devsphere.storage.s3.signing-secret=${STORAGE_SIGNING_SECRET:}

# Real-time WebSocket / STOMP
devsphere.realtime.max-sessions-per-user=10

# AI Provider & Secret Encryption
devsphere.ai.encryption-key=${AI_SECRET_ENCRYPTION_KEY:}
devsphere.ai.allow-loopback-self-host=${AI_ALLOW_LOOPBACK_SELF_HOST:false}
devsphere.ai.connect-timeout-ms=5000
devsphere.ai.request-timeout-ms=60000
devsphere.ai.max-response-bytes=2097152

# GitHub App & REST API Sync
devsphere.github.app.enabled=${GITHUB_APP_ENABLED:false}
devsphere.github.app.app-id=${GITHUB_APP_ID:}
devsphere.github.app.private-key-pem=${GITHUB_APP_PRIVATE_KEY_PEM:}
devsphere.github.app.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
devsphere.github.app.allow-loopback-api=${GITHUB_APP_ALLOW_LOOPBACK_API:false}
devsphere.github.app.connect-timeout-ms=5000
devsphere.github.app.request-timeout-ms=30000
