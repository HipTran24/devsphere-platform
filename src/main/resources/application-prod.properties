# Production profile (SPRING_PROFILES_ACTIVE=prod).

# Actuator lives on an internal management port that is never routed publicly.
management.server.port=8081
management.endpoint.health.show-details=when-authorized

# Real AWS SigV4 presigned URLs; credentials come from the AWS default provider chain.
devsphere.storage.s3.mode=aws
devsphere.storage.s3.endpoint=${S3_ENDPOINT:}
devsphere.storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}

# Background scheduler always runs in production.
spring.quartz.auto-startup=true

# Honour X-Forwarded-* from the reverse proxy for redirects and absolute links.
server.forward-headers-strategy=framework

# Connection pool sized for 4 Quartz threads plus request traffic.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# High-throughput batching and prepared statement caching for production
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
